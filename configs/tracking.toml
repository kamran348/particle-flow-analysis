# PTV starting settings for the experimental video in default.toml.
# Inspect the replay: these thresholds select bright spots, not verified objects.
[video]
path = "data/raw/Project30102026_100mA_z_3754_ICC_ch00_SV.wmv"
start_frame = 0
stop_frame = 0
step = 100
fps_override = 0.0

[preprocessing]
gaussian_sigma = 0.7
clahe_clip_limit = 0.0

[exclusion]
overlay_colors = ["red", "green"]
padding = 60
rectangles = []

[calibration]
mm_per_pixel = 0.0

[tracking]
enabled = true
diameter = 15            # odd width in original pixels, before any resizing
min_mass = 1000.0        # reject the many faint noise peaks in this footage
search_range = 7.0       # maximum displacement per selected frame, px
memory = 1

[consistency]
# Shared selection for replay, trajectories and analysis. Detection uses step=1.
enabled = true
window_frames = 50     # nonoverlapping SOURCE-frame windows; incomplete tail ignored
min_fraction = 1.0      # require all 100 frames; 0.9 allows up to 10 missing
require_endpoints = true # same linked ID in first and last frame of each window
